    <!-- Favicon -->

    <!-- Primary meta (overridden at runtime by react-helmet-async) -->

    <!-- Open Graph (static fallback for crawlers without JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maf-studio.fr/" />
    <meta property="og:title" content="MAF STUDIO — Growth Ops, Ads &amp; Automatisation IA | Mohamed-Amine Fadel" />

    <meta property="og:image" content="https://maf-studio.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="MAF STUDIO" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card (static fallback) -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://maf-studio.fr/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://maf-studio.fr/" />

    <!-- Calendly widget assets (chargés avant le JS React) -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
