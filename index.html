<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>MAF Studio — Agence web et digitale, site en ligne en 5 jours ouvrés</title>
    <meta name="description" content="Agence web et digitale. Site vitrine à 1 490 € HT livré en 5 jours ouvrés, boutique en ligne, publicité Google et Meta. Site, domaine et code à votre nom. À distance, partout en France." />
    <meta name="author" content="Mohamed-Amine Fadel" />
    <meta name="theme-color" content="#F2F0EA" />

    <!--
      Les balises de partage restent ICI, en statique, et nulle part ailleurs.
      LinkedIn, WhatsApp et Slack n'exécutent pas de JavaScript : ce sont les
      seules qu'ils lisent. react-helmet-async ne gère que ce qui varie d'une
      route à l'autre (titre, canonique, robots), sinon les deux se dupliquent
      dans le <head> — et sur les pages légales, deux directives robots
      contradictoires cohabitaient.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.maf-studio.fr/" />
    <meta property="og:title" content="MAF Studio — Agence web et digitale, site en ligne en 5 jours ouvrés" />
    <meta property="og:description" content="Site vitrine à 1 490 € HT livré en 5 jours ouvrés. Site, domaine et code à votre nom, sans abonnement obligatoire." />
    <meta property="og:image" content="https://www.maf-studio.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="MAF Studio" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAF Studio — Agence web et digitale, site en ligne en 5 jours ouvrés" />
    <meta name="twitter:description" content="Site vitrine à 1 490 € HT livré en 5 jours ouvrés. Site, domaine et code à votre nom." />
    <meta name="twitter:image" content="https://www.maf-studio.fr/og-image.jpg" />

    <link rel="canonical" href="https://www.maf-studio.fr/" />

    <!--
      Polices auto-hébergées via @fontsource-variable, importées dans
      index.css : aucun appel à fonts.googleapis.com, donc aucune adresse IP
      de visiteur transmise à Google et une requête tierce en moins.

      Cal.com n'est plus chargé ici. Son script est injecté au premier clic
      sur un bouton de réservation (voir BookingButton.tsx) : le chemin
      critique s'allège et l'IP du visiteur n'est plus envoyée à un tiers
      sans la moindre interaction de sa part.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
